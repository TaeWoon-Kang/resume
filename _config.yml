# Site settings
title: "Taewoon's Resume"
#description: "A resume template for Jekyll and GitHub Pages sites."
description: "A resume template for Taewoon Kang."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Taewoon Kang"
resume_title:                   "Ph.D. Student in Computer Science and Engineering"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "taewoon_kang@korea.ac.kr"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+82-10-9368-1374"
resume_contact_address:         "145, Anam-ro, Seongbuk-gu, Seoul, Republic of Korea"

resume_header_contact_info:     "Seoul, Republic of Korea • +82-10-9368-1374 • taewoon_kang@korea.ac.kr"
display_header_contact_info:    "true"

resume_header_intro: "<p>Combined M.S./Ph.D. student at Korea University researching computer architecture, AI accelerators, and processing-in-memory systems. My work centers on efficient hardware and system design for modern machine learning workloads, with experience spanning ASIC design, RTL implementation, architectural simulation, and embedded AI systems.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_publications:    true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           false
resume_section_associations:    false
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/taewoon-kang"
  resume_linkedin_url:          "https://www.linkedin.com/in/taewoonkang"
  resume_website_url:           "https://taewoon-kang.github.io/resume/"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
